name: Bootstrap

# Creates or updates what the Site workflow stands on: the Terraform state
# bucket and the pipeline's roles (plan, deploy, one per service, publish).
# Run it by hand: once before the first deploy, and again whenever those roles
# or their permissions change.
#
# It runs as the bootstrap role, which GitHub may only assume from the
# bootstrap environment, and that environment needs a reviewer's approval. The
# role and the sign-in to AWS it relies on are the seed, made once by
# scripts/seed.sh (see runbooks/bootstrap.md).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.10.5"
  # The one environment this workflow serves.
  ENVIRONMENT: dev
  API_PACKAGE_DIR: build/api
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  names:
    name: Names
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.names.outputs.project }}
      aws_region: ${{ steps.names.outputs.aws_region }}
      bootstrap_role_arn: ${{ steps.names.outputs.bootstrap_role_arn }}
      deploy_role_arn: ${{ steps.names.outputs.deploy_role_arn }}
      bootstrap_environment: ${{ steps.names.outputs.bootstrap_environment }}
      deploy_environment: ${{ steps.names.outputs.deploy_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Work out the names
        id: names
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::The repository variable AWS_ACCOUNT_ID is not set. Run scripts/seed.sh; see runbooks/bootstrap.md."
            exit 1
          fi
          scripts/names.sh "$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  bootstrap:
    name: Bootstrap
    needs: names
    runs-on: ubuntu-latest
    environment: ${{ needs.names.outputs.bootstrap_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.names.outputs.bootstrap_role_arn }}
          aws-region: ${{ needs.names.outputs.aws_region }}

      - name: Apply the bootstrap stack
        env:
          GITHUB_SUBJECT_PREFIX: ${{ vars.OIDC_SUBJECT_PREFIX }}
        run: scripts/bootstrap.sh "$ENVIRONMENT"
