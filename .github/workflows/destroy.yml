name: Destroy

# Takes the whole environment down: the site and the sign-up backend first, as
# the deploy role and its service roles, then the pipeline's roles and the
# state bucket, as the bootstrap role. The seed is left in place, so the
# Bootstrap and Site workflows can build it all again.
#
# Run it by hand. It deletes the account table and the sign-in pool, so the
# project's name has to be typed, and the second half needs a reviewer's
# approval through the bootstrap environment.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the project name to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.10.5"
  # The one environment this workflow serves.
  ENVIRONMENT: dev
  API_PACKAGE_DIR: build/api
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  names:
    name: Names
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.names.outputs.project }}
      aws_region: ${{ steps.names.outputs.aws_region }}
      bootstrap_role_arn: ${{ steps.names.outputs.bootstrap_role_arn }}
      deploy_role_arn: ${{ steps.names.outputs.deploy_role_arn }}
      bootstrap_environment: ${{ steps.names.outputs.bootstrap_environment }}
      deploy_environment: ${{ steps.names.outputs.deploy_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Work out the names
        id: names
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::The repository variable AWS_ACCOUNT_ID is not set. Run scripts/seed.sh; see runbooks/bootstrap.md."
            exit 1
          fi
          scripts/names.sh "$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: The project name must have been typed
        env:
          TYPED: ${{ inputs.confirm }}
          PROJECT: ${{ steps.names.outputs.project }}
        run: |
          if [ "$TYPED" != "$PROJECT" ]; then
            echo "::error::Not confirmed: the project name was not typed. Nothing has been destroyed."
            exit 1
          fi

  site:
    name: Destroy the site
    needs: names
    runs-on: ubuntu-latest
    environment: ${{ needs.names.outputs.deploy_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.names.outputs.deploy_role_arn }}
          aws-region: ${{ needs.names.outputs.aws_region }}

      # Terraform reads the function package while planning the destroy.
      - name: Build the API package
        run: |
          pip install -e .
          python tools/build_api.py --out "$API_PACKAGE_DIR"

      - name: Destroy the site stack
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          CONFIRM_PROJECT: ${{ inputs.confirm }}
          ASSUME_SERVICE_ROLES: "true"
        run: scripts/destroy.sh "$ENVIRONMENT" site

  bootstrap:
    name: Destroy the roles and the state bucket
    needs: [names, site]
    runs-on: ubuntu-latest
    environment: ${{ needs.names.outputs.bootstrap_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.names.outputs.bootstrap_role_arn }}
          aws-region: ${{ needs.names.outputs.aws_region }}

      - name: Destroy the bootstrap stack
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          CONFIRM_PROJECT: ${{ inputs.confirm }}
          GITHUB_SUBJECT_PREFIX: ${{ vars.OIDC_SUBJECT_PREFIX }}
        run: scripts/destroy.sh "$ENVIRONMENT" bootstrap
